<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>技趣星球 · Planet Components</title>
    <meta
      name="description"
      content="技趣星球 TechSkillPlanet Planet Components — 57 个跨平台基础控件，Sky Planet 设计语言，8 端一致 API。"
    />
    <meta name="theme-color" content="#31A8FF" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <span class="cloud c1"></span>
      <span class="cloud c2"></span>
      <span class="cloud c3"></span>
      <span class="orb"></span>
    </div>

    <main class="hero">
      <p class="eyebrow">TechSkillPlanet</p>
      <h1 class="brand">技趣星球</h1>
      <p class="slogan">用技术创造乐趣</p>
      <p class="lead">
        跨平台基础控件库 · Sky Planet 设计语言 · 契约对齐的 57 个组件，覆盖 Android / iOS / Flutter / React / Vue / RN / 小程序 / Kuikly
      </p>

      <div class="cta">
        <a class="btn primary" href="./demo/" rel="noopener">在线组件演示</a>
        <a
          class="btn ghost"
          href="https://github.com/techskillplanet/planet-components"
          rel="noopener noreferrer"
          >GitHub 仓库</a
        >
      </div>
    </main>

    <section class="stacks" aria-labelledby="stacks-title">
      <h2 id="stacks-title">支持栈</h2>
      <p class="stacks-lead">57 个契约组件 · 一套 Sky Planet Token · Android / iOS / Flutter / React / Vue / RN / 小程序 / Kuikly</p>
    </section>

    <footer class="foot">
      <span>© <span id="y"></span> TechSkillPlanet</span>
      <span class="sep">·</span>
      <a href="https://github.com/techskillplanet/planet-components">planet-components</a>
    </footer>

    <script>
      document.getElementById("y").textContent = String(new Date().getFullYear());
    </script>
  </body>
</html>
