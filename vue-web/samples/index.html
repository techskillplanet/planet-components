<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Controls Vue Sample</title>
    <!-- Local styles so file:// and http:// both work without parent-path CORS. -->
    <link rel="stylesheet" href="./dist/styles.css" />
    <style>
      .bc-boot-error {
        margin: 24px auto;
        max-width: 640px;
        padding: 16px 18px;
        border: 1px solid #FF6B7A;
        border-radius: 16px;
        color: #173A62;
        background: #fff;
        font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- IIFE bundle: works with double-click file:// and local http preview. -->
    <script>
      window.addEventListener('error', function (event) {
        if (document.querySelector('.bc-boot-error')) return;
        var box = document.createElement('pre');
        box.className = 'bc-boot-error';
        box.textContent = [
          'Sample failed to start.',
          'Preferred: cd vue-web/samples && npm run preview',
          'then open http://127.0.0.1:5174/',
          '',
          String(event && event.error && event.error.stack || event.message || event)
        ].join('\n');
        document.body.appendChild(box);
      });
    </script>
    <script src="./dist/preview.js"></script>
  </body>
</html>
