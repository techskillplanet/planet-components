plugins {
    id "com.android.library"
    id "maven-publish"
    id "signing"
}

group = "io.github.techskillplanet"
version = "0.2.0"

android {
    namespace "com.techskillplanet.basiccontrols"
    compileSdk 35

    defaultConfig {
        minSdk 23
        consumerProguardFiles "consumer-rules.pro"
    }

    sourceSets {
        main {
            assets.srcDirs = ["src/main/assets"]
        }
        debug {
            java.srcDirs = ["src/debug/java"]
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

def githubRepoUrl = "https://github.com/techskillplanet/planet-components"

publishing {
    publications {
        release(MavenPublication) {
            groupId = "io.github.techskillplanet"
            artifactId = "planet-components-android"
            version = project.version

            pom {
                name = "TechSkillPlanet Planet Components Android View"
                description = "Cross-platform Planet Components UI library for Android View (Java, traditional View, token-driven theme)."
                url = githubRepoUrl
                inceptionYear = "2026"
                licenses {
                    license {
                        name = "The MIT License"
                        url = "https://opensource.org/licenses/MIT"
                        distribution = "repo"
                    }
                }
                developers {
                    developer {
                        id = "techskillplanet"
                        name = "TechSkillPlanet"
                        organization = "TechSkillPlanet"
                        organizationUrl = "https://github.com/techskillplanet"
                    }
                }
                scm {
                    connection = "scm:git:git://${githubRepoUrl.replace('https://', '')}.git"
                    developerConnection = "scm:git:ssh://git@github.com:techskillplanet/planet-components.git"
                    url = "${githubRepoUrl}/tree/main/android/library"
                }
            }

            afterEvaluate {
                from components.release
            }
        }
    }

    repositories {
        maven {
            name = "MavenCentral"
            // OSSRH Staging API compatibility layer for Central Portal (see central.sonatype.org)
            url = uri("https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/")
            credentials {
                username = findProperty("ossrhUsername") ?: ""
                password = findProperty("ossrhPassword") ?: ""
            }
        }
    }
}

def hasSigningKey = project.findProperty("signing.keyId") != null
        && (project.findProperty("signingInMemoryKey") != null
        || project.findProperty("signingKeyFile") != null
        || project.findProperty("signing.secretKeyRingFile") != null)

if (hasSigningKey) {
    signing {
        def keyId = findProperty("signing.keyId")?.toString()
        def password = findProperty("signing.password")?.toString()
        if (findProperty("signingKeyFile") != null) {
            useInMemoryPgpKeys(keyId, file(findProperty("signingKeyFile")).text, password)
        }
        sign publishing.publications.release
    }
}
